# Local WordPress for developing the osous theme.
#
#   docker compose up -d          start everything
#   docker compose down           stop (data is kept)
#   docker compose down -v        stop and wipe the database
#
#   WordPress   http://localhost:8080
#   phpMyAdmin  http://localhost:8081     server: db  ·  user: wordpress  ·  pass: wordpress
#
# WP-CLI runs as a one-off container, e.g.
#   docker compose run --rm cli wp theme list
#   docker compose run --rm cli wp db import /var/www/html/production.sql
#
# The theme folder and the shared assets are mounted from this repo, so editing a
# file here changes the site immediately — no copying, no build step for PHP.

name: osous

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  wordpress:
    # Pin this to the production version once confirmed, e.g. wordpress:7.1-php8.3-apache.
    image: ${WP_IMAGE:-wordpress:php8.3-apache}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # Verbose errors locally; never carry this to production.
      WORDPRESS_DEBUG: 1
      # The image's wp-config.php eval()s this on every load, so it holds on every
      # container start without a line written into the file. wp-cli is given the same.
      WORDPRESS_CONFIG_EXTRA: &wp-config-extra |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'SCRIPT_DEBUG', true );
        define( 'DISALLOW_FILE_EDIT', true );
        // Without this WordPress caches its scan of theme/patterns/ in a transient, and a
        // pattern added after the first page load simply does not exist until the cache
        // expires. The cache is keyed per theme and survives a plugin flush, so it is worth
        // turning off rather than remembering to clear. Costs a directory scan per request;
        // local only. Defined here and nowhere else: a second define written into
        // wp-config.php (wp config set) warns on every request.
        define( 'WP_DEVELOPMENT_MODE', 'theme' );
    volumes:
      - wp:/var/www/html
      # The theme under development. `assets/` is mounted separately so the static
      # reference pages at the repo root keep working from the same files.
      - ./theme:/var/www/html/wp-content/themes/osous
      - ./assets:/var/www/html/wp-content/themes/osous/assets:ro
      # Local only. Serving the static reference from the same origin as WordPress is
      # what lets _tools/geometry.py measure both versions of a page side by side in
      # one browser context; cross-origin frames cannot be measured.
      - ./:/var/www/html/static:ro
      # Local only. One must-use plugin that routes wp_mail() to the mail catcher below,
      # so a contact form submission can be followed all the way to the message.
      - ./_tools/local/mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      # Local only. Uploads up to 64 MB, as hosts commonly allow: PHP's own 8 MB refuses
      # the theme zip from Appearance -> Themes (see the file).
      - ./_tools/local/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro

  # Catches everything WordPress tries to send. The image has no MTA, so without this
  # wp_mail() returns false and the contact form reports an error on every submission.
  #   Inbox  http://localhost:8025      API  http://localhost:8025/api/v1/messages
  mailpit:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"

  cli:
    image: wordpress:cli
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      # The site's own additions to wp-config.php, so `wp` runs in the same development
      # mode as the site: the file itself no longer defines it.
      WORDPRESS_CONFIG_EXTRA: *wp-config-extra
    volumes:
      - wp:/var/www/html
      - ./theme:/var/www/html/wp-content/themes/osous
      - ./assets:/var/www/html/wp-content/themes/osous/assets:ro
      - ./_migration:/migration
      # The same local mail route as the wordpress service, so `wp eval` sends the same way.
      - ./_tools/local/mu-plugins:/var/www/html/wp-content/mu-plugins:ro

  phpmyadmin:
    image: phpmyadmin:5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: wordpress
      PMA_PASSWORD: wordpress
      UPLOAD_LIMIT: 512M

volumes:
  db:
  wp:
