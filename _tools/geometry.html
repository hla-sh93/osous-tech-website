<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Osous geometry check</title>
<!--
  Measures every page twice -- the static reference and the WordPress render -- and
  compares section offsets and heights, then the computed style of every element in
  <main> across the properties listed in PROPS.

  It also checks each side on its own for a pinned section that engages too early, which
  is a fault both copies can share and no comparison would ever catch.

  Structural equality (see _tools/verify_wp.py) proves the markup matches. It does not
  prove the page *looks* the same: a stylesheet that failed to load, a font that resolved
  differently or a scroll module that never bound would all leave the DOM untouched and
  the layout wrong. This is the check for that.

  It has to run from the WordPress origin, because a frame from another origin cannot be
  measured. docker-compose mounts the repo at /static for exactly this reason:

      http://localhost:8080/static/_tools/geometry.html?slugs=about,index
      ...&w=768&h=1024        any viewport; defaults to 1440x900

  The default matters: the page header is 90vh, so a different height silently changes
  every offset on the page. The breakpoints worth re-running are 991, 767 and 479.

  Results land in window.RESULT as soon as the run finishes.
-->
<style>
  body { font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; margin: 16px; }
  /*
     On screen, behind the report, rather than parked at left: -9999px. The design reveals
     its headings, fields and buttons through IntersectionObserver, and an element in a
     frame that is off screen never intersects anything -- so nothing in either frame was
     ever revealed, and the comparison was of two pages held at opacity 0. That hid the
     settled page from the check, and it broke the moment one side had a script that set
     an opacity of its own: Turnstile enables the contact form's button with an inline
     opacity: 1, which the static page, unrevealed, never matched. Here the frames sit in
     the viewport at z-index -1: intersection is about geometry, not what is drawn on top.
  */
  iframe { border: 0; position: fixed; top: 0; left: 0; z-index: -1; opacity: 0; }
  table { border-collapse: collapse; margin-top: 12px; }
  td, th { padding: 2px 10px 2px 0; text-align: left; vertical-align: top; }
  .ok { color: #2e7d32; }
  .bad { color: #c62828; font-weight: 700; }
  #status { font-weight: 700; }
</style>
</head>
<body>

<div id="status">starting…</div>
<table id="out"><thead><tr><th>page<th>static<th>wordpress<th>result</thead><tbody></tbody></table>

<script>
(function () {
  'use strict';

  var TOLERANCE = 1;          // sub-pixel rounding only
  var SETTLE_MS = 700;        // deferred scripts, then a second settle after images
  var STABLE_SAMPLES = 3;     // consecutive identical readings before a page is believed

  /*
   * Properties worth comparing on every element. Geometry catches a stylesheet that did
   * not load; this catches one that loaded in the wrong order, where the page is the
   * right size and the wrong colour.
   */
  var PROPS = ['display', 'position', 'color', 'background-color', 'background-image',
    'font-family', 'font-size', 'font-weight', 'line-height', 'letter-spacing',
    'text-align', 'text-transform', 'margin-top', 'margin-bottom',
    'padding-top', 'padding-right', 'padding-bottom', 'padding-left',
    'border-top-width', 'border-radius', 'border-color', 'flex-direction', 'align-items',
    'justify-content', 'gap', 'grid-template-columns', 'grid-area', 'opacity', 'overflow',
    'transform', 'z-index', 'animation-name', 'animation-duration'];

  /*
   * The logo marquee never stops moving, so sampling it in two frames a second apart
   * reports a transform that differs by a pixel and means nothing. Comparing the
   * animation that drives it is the real check; the transform it happens to be at is not.
   *
   * `margin-left` and `margin-right` are missing from PROPS for a related reason: Chrome
   * resolves an `auto` margin to its used value only when layout happens to be clean, so
   * the same element reports 0px or 46.33px depending on nothing at all. Every element's
   * measured left edge and width go into the digest instead, which is what the margin was
   * being read for anyway and is always true.
   */
  var TRANSFORM = PROPS.indexOf('transform');
  var ANIMATION = PROPS.indexOf('animation-name');

  var params = new URLSearchParams(location.search);
  var WIDTH = parseInt(params.get('w'), 10) || 1440;
  var HEIGHT = parseInt(params.get('h'), 10) || 900;

  function frameFor(url) {
    var frame = document.createElement('iframe');
    frame.width = WIDTH;
    frame.height = HEIGHT;
    frame.src = url;
    document.body.appendChild(frame);
    return frame;
  }

  function once(target, type) {
    return new Promise(function (resolve) {
      target.addEventListener(type, resolve, { once: true });
    });
  }

  function wait(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  /*
   * Wait for GSAP to stop moving. The card stack fans itself out with tweens that run for
   * about half a second after ScrollTrigger initialises, and sampling in the middle of
   * one reports a transform that is on its way somewhere -- true for an instant, and
   * different from the same page sampled an instant later.
   */
  async function tweensIdle(win) {
    if (!win.gsap) { return; }

    /*
     * Idle twice, a moment apart. One reading is not enough: a ScrollTrigger refresh can
     * re-run the code that starts these tweens, so the timeline goes quiet, and then
     * moves again -- which showed up as a card stuck at opacity 0.9926 on a page that
     * settles at 1.
     */
    var quiet = 0;
    for (var i = 0; i < 80 && quiet < 2; i++) {
      var busy = win.gsap.globalTimeline.getChildren(true, true, false)
        .some(function (tween) { return tween.isActive(); });
      quiet = busy ? 0 : quiet + 1;
      await wait(quiet === 1 ? 300 : 50);
    }
  }

  /*
   * Swiper writes its first transform during init, and on the WordPress side its bundle
   * comes from a different cache key than the static page's, so it lands later. Waiting
   * for the class it sets is exact, where a longer blanket delay would only be lucky.
   */
  async function carouselReady(doc) {
    var container = doc.querySelector('.swiper-container');
    if (!container) { return; }
    for (var i = 0; i < 80; i++) {
      var wrapper = container.querySelector('.swiper-wrapper');
      // The class lands a moment before the transform does; the transform is the tell.
      if (container.classList.contains('swiper-initialized') &&
          wrapper && wrapper.style.transform) {
        return;
      }
      await wait(50);
    }
  }

  function imagesDone(doc) {
    var pending = Array.prototype.filter.call(doc.images, function (img) { return !img.complete; });
    return Promise.all(pending.map(function (img) {
      return new Promise(function (resolve) { img.onload = img.onerror = resolve; });
    }));
  }

  /** Load a URL in a WIDTH x HEIGHT frame and report the geometry of everything in <main>. */
  async function measure(url) {
    var frame = frameFor(url);
    await once(frame, 'load');

    var win = frame.contentWindow;
    var doc = frame.contentDocument;

    await wait(SETTLE_MS);
    if (doc.fonts && doc.fonts.ready) { await doc.fonts.ready; }
    await imagesDone(doc);
    await carouselReady(doc);
    win.dispatchEvent(new win.Event('resize'));

    /*
     * A pinned section is wrapped in a .pin-spacer once ScrollTrigger has measured the
     * page, and until that happens the element list is one shorter than it will be.
     * Sampling either side mid-refresh reports a difference that is not there, so force
     * the refresh and let it land rather than hoping the timing works out.
     */
    if (win.ScrollTrigger && win.ScrollTrigger.refresh) {
      win.ScrollTrigger.refresh();
      await wait(250);
    }

    await tweensIdle(win);
    await wait(SETTLE_MS);
    win.scrollTo(0, 0);
    await wait(100);

    /*
     * Sample until several readings in a row agree. A ScrollTrigger refresh can revert a
     * matchMedia context and re-apply it, and for the moment in between the transforms
     * it set are gone; a single sample that lands there is simply wrong. Three matching
     * readings mean the page has stopped changing under us -- two is not enough, because
     * a library that is merely slow to start looks perfectly stable until it starts.
     */
    var previous = null;
    var agreed = 1;
    for (var attempt = 0; attempt < 8; attempt++) {
      var current = sample(win, doc);
      agreed = (previous && previous.digest === current.digest) ? agreed + 1 : 1;
      previous = current;
      if (agreed >= STABLE_SAMPLES) {
        break;
      }
      await wait(400);
    }
    frame.remove();
    return previous;
  }

  /** One reading of a settled document. */
  function sample(win, doc) {
    var main = doc.querySelector('main');

    /*
     * Where the page itself begins. Normally zero -- but the WordPress admin bar sets
     * `html { margin-top: 32px }` for anyone who is logged in, which is everyone who has
     * just been in the editor. Measuring from the viewport instead would put every
     * section on the WordPress side 32px lower than the same section on the static one,
     * and report all 57 pages as broken when nothing had moved at all.
     */
    var origin = Math.round(doc.documentElement.getBoundingClientRect().top + win.scrollY);

    var rows = Array.prototype.map.call(main.children, function (el) {
      var box = el.getBoundingClientRect();
      return {
        name: (el.className || el.tagName).toString().split(' ').slice(0, 2).join(' '),
        top: Math.round(box.top + win.scrollY) - origin,
        height: Math.round(box.height)
      };
    });

    // An element inside a moving container is moving too, even though its own
    // animation-name is `none` -- every logo in the marquee, for instance.
    var moving = new WeakSet();

    /*
     * Contact Form 7's scaffolding, on the contact page: the wrapper, the announcement
     * region, the hidden fields, the span around every control, the response box, the
     * spinner, and whatever Turnstile builds inside its box. verify_wp.py takes the same
     * list away by name before comparing markup; here those elements are left out of the
     * style digest, and everything else has to match. The form's own boxes are measured
     * against the reference in _tools/verify_contact.js.
     */
    var CF7 = '.wpcf7, .screen-reader-response, .screen-reader-response *, ' +
      '.hidden-fields-container, .hidden-fields-container *, .wpcf7-form-control-wrap, ' +
      '.wpcf7-response-output, .wpcf7-not-valid-tip, .wpcf7-spinner, .cf7-cf-turnstile *';
    var elements = Array.prototype.filter.call(main.querySelectorAll('*'), function (el) {
      return !el.matches(CF7);
    });

    var styles = elements.map(function (el) {
      var computed = win.getComputedStyle(el);
      var parts = PROPS.map(function (prop) { return computed.getPropertyValue(prop); });
      var animated = (parts[ANIMATION] && parts[ANIMATION] !== 'none') || moving.has(el.parentElement);
      if (animated) {
        moving.add(el);
        parts[TRANSFORM] = '<animated>';
      }
      /*
       * Swiper writes `translate3d(0px, 0px, 0px)` on its track during init and rewrites
       * it as the loop settles, so whether it is there at any given instant is a race
       * with no visual consequence -- an identity transform and none render the same.
       * Excluding it costs nothing: if the track ever really moved, every slide inside it
       * would report a different left edge, and those are compared.
       */
      if (el.classList.contains('swiper-wrapper')) {
        parts[TRANSFORM] = '<carousel>';
      }
      var box = el.getBoundingClientRect();
      parts.push(animated ? '<animated>' : Math.round(box.left) + '+' + Math.round(box.width));
      // Both sides serve the same file from different paths; compare the file, not the path.
      return (el.tagName.toLowerCase() + '|' + parts.join('|'))
        .replace(/url\(("|')?[^"')]*\/assets\//g, 'url(assets/');
    });

    /*
     * Where each pinned section actually starts pinning. A pin that engages more than a
     * viewport before its own element reaches the screen is measured against the wrong
     * page -- which is what happens when one pin above another is refreshed second, and
     * it shows up as a heading floating over the section before it.
     */
    var pins = [];
    if (win.ScrollTrigger) {
      win.ScrollTrigger.getAll().forEach(function (trigger) {
        if (!trigger.pin || !trigger.trigger) { return; }
        var top = Math.round(trigger.trigger.getBoundingClientRect().top + win.scrollY) - origin;
        pins.push({
          name: (trigger.trigger.className || trigger.trigger.tagName).toString()
            .split(' ').slice(0, 2).join(' '),
          start: Math.round(trigger.start),
          top: top,
          early: top - Math.round(trigger.start)
        });
      });
    }

    var total = doc.documentElement.scrollHeight - origin;

    return {
      total: total,
      adminBar: origin,
      mainHeight: Math.round(main.getBoundingClientRect().height),
      rows: rows,
      styles: styles,
      pins: pins,
      digest: total + '|' + rows.map(function (row) {
        return row.top + ':' + row.height;
      }).join(',') + '|' + styles.join('~')
    };
  }

  function earlyPins(measured, label) {
    return (measured.pins || [])
      .filter(function (pin) { return pin.early > HEIGHT; })
      .map(function (pin) {
        return label + ' pin "' + pin.name + '" starts at ' + pin.start +
               ' but the element is at ' + pin.top + ' (' + pin.early + 'px early)';
      });
  }

  function diff(a, b) {
    var problems = earlyPins(a, 'static').concat(earlyPins(b, 'wp'));
    if (Math.abs(a.total - b.total) > TOLERANCE) {
      problems.push('page height static=' + a.total + ' wp=' + b.total);
    }
    if (a.rows.length !== b.rows.length) {
      problems.push('section count static=' + a.rows.length + ' wp=' + b.rows.length);
      return problems;
    }
    for (var i = 0; i < a.rows.length; i++) {
      var x = a.rows[i], y = b.rows[i];
      if (Math.abs(x.top - y.top) > TOLERANCE || Math.abs(x.height - y.height) > TOLERANCE) {
        problems.push('#' + i + ' ' + x.name + ' static=' + x.top + '+' + x.height +
                      ' wp=' + y.top + '+' + y.height);
      }
    }

    if (a.styles.length !== b.styles.length) {
      problems.push('element count static=' + a.styles.length + ' wp=' + b.styles.length);
      return problems;
    }
    for (var j = 0; j < a.styles.length; j++) {
      if (a.styles[j] === b.styles[j]) { continue; }
      var one = a.styles[j].split('|'), two = b.styles[j].split('|');
      for (var k = 1; k < one.length; k++) {
        if (one[k] !== two[k]) {
          problems.push('style el ' + j + ' <' + one[0] + '> ' +
                        (PROPS[k - 1] || 'left+width') +
                        ': static=' + one[k] + ' wp=' + two[k]);
        }
      }
      break;
    }
    return problems;
  }

  function cell(row, text, cssClass) {
    var td = document.createElement('td');
    td.textContent = text;
    if (cssClass) { td.className = cssClass; }
    row.appendChild(td);
  }

  /*
   * The static pages ask for `assets/js/list-scroll.js` with no version query, so a
   * browser that has seen the old copy keeps serving it while WordPress -- which does
   * add a version -- gets the new one. That reads as a difference between the two sides
   * when the only difference is the cache. Re-fetching every shared asset with
   * `cache: 'reload'` puts a fresh copy in the HTTP cache before anything is measured.
   */
  async function refreshAssets() {
    var files = ['css/tokens.css', 'css/base.css', 'css/layout.css', 'css/components.css',
      'css/navigation.css', 'css/sections.css', 'css/utilities.css', 'css/animations.css',
      'js/navigation.js', 'js/reveal.js', 'js/list-scroll.js', 'js/split-section.js',
      'js/overlapping-cards.js', 'js/industries-carousel.js'];
    var cdn = ['https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js',
      'https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js'];

    await Promise.all(files.map(function (file) {
      return fetch('/static/assets/' + file, { cache: 'reload' }).catch(function () {});
    }).concat(
      // WordPress asks for these with a ?ver= query, which is a separate cache entry, so
      // warm both spellings or the first page measured waits on the network mid-sample.
      cdn.map(function (url) {
        return fetch(url, { mode: 'no-cors' }).catch(function () {});
      }),
      cdn.map(function (url) {
        return fetch(url + '?ver=x', { mode: 'no-cors' }).catch(function () {});
      })
    ));
  }

  async function run() {
    var slugs = (params.get('slugs') || '').split(',').filter(Boolean);
    var status = document.getElementById('status');
    var body = document.querySelector('#out tbody');
    var report = { pages: {}, failed: [], done: false };

    status.textContent = 'refreshing shared assets…';
    await refreshAssets();

    for (var i = 0; i < slugs.length; i++) {
      var slug = slugs[i];
      status.textContent = (i + 1) + '/' + slugs.length + '  ' + slug;

      var row = document.createElement('tr');
      body.appendChild(row);
      cell(row, slug);

      try {
        var stat = await measure('/static/' + slug + '.html');
        var wp = await measure(slug === 'index' ? '/' : '/' + slug + '/');
        var problems = diff(stat, wp);

        cell(row, stat.total + 'px / ' + stat.rows.length);
        cell(row, wp.total + 'px / ' + wp.rows.length);
        cell(row, problems.length ? problems.join(' | ') : 'match',
             problems.length ? 'bad' : 'ok');

        report.pages[slug] = { static: stat.total, wp: wp.total, problems: problems };
        if (problems.length) { report.failed.push(slug); }
      } catch (err) {
        cell(row, '-');
        cell(row, '-');
        cell(row, String(err), 'bad');
        report.pages[slug] = { problems: [String(err)] };
        report.failed.push(slug);
      }
    }

    report.done = true;
    window.RESULT = report;
    report.viewport = WIDTH + 'x' + HEIGHT;
    status.textContent = 'done at ' + WIDTH + 'x' + HEIGHT + ' — ' + report.failed.length +
      ' of ' + slugs.length + ' pages differ';
  }

  window.RESULT = { done: false };
  run();
}());
</script>
</body>
</html>
