; Mounted by docker-compose.yml for local development only; never shipped.
;
; PHP's own limits are 2 MB a file and 8 MB a request, and the theme zip is 9.4 MB. Sent
; from Appearance -> Themes -> Upload Theme, PHP throws the whole request away before
; WordPress sees it -- "POST Content-Length ... exceeds the limit" in the server log --
; and WordPress, finding no form at all, says "The link you followed has expired." A
; picture over 2 MB fails the same way in the Media Library. Hosts commonly allow 64 MB
; or more; so does this one. HANDOFF.txt tells the receiver what to do on a host that
; does not.
upload_max_filesize = 64M
post_max_size = 64M
